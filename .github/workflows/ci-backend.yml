name: Backend CI (Build & Verify - includes Frontend)

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'smart-admin-api-java17-springboot3/**'
      - 'smart-admin-api-java8-springboot2/**'
      - 'smart-admin-web-typescript/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'smart-admin-api-java17-springboot3/**'
      - 'smart-admin-api-java8-springboot2/**'
      - 'smart-admin-web-typescript/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    name: Build Frontend (smart-admin-web-typescript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 (Vite 5 requires Node >= 18)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smart-admin-web-typescript/package.json

      - name: npm install + build:prod (dist/)
        working-directory: smart-admin-web-typescript
        run: |
          set -euo pipefail
          node -v ; npm -v
          npm install --no-audit --no-fund 2>&1 | tail -20
          npm run build:prod 2>&1 | tail -30
          echo ""
          echo "=== dist/ 产物清单 ==="
          ls -lah dist/
          echo ""
          echo "=== dist total size ==="
          du -sh dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-admin-web-dist
          path: smart-admin-web-typescript/dist/**
          retention-days: 7

  build-java17:
    name: Build Backend (Java 17 + Spring Boot 3 + Frontend)
    needs: build-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-admin-api-java17-springboot3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: smart-admin-web-dist
          path: smart-admin-web-typescript/dist

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install firewall-jdbc JAR from GitHub Release (com.firewall:firewall-jdbc:1.0.2)
        run: |
          set -euo pipefail
          JAR_URL="https://github.com/toneliu/firewall-jdbc/releases/download/v1.0.2/firewall-jdbc-1.0.2.jar"
          TMP="/tmp/firewall-jdbc-1.0.2.jar"
          echo "下载 $JAR_URL ..."
          curl -sSL --fail-with-body -o "$TMP" "$JAR_URL"
          ls -lh "$TMP"
          mvn -B install:install-file \
            -Dfile="$TMP" \
            -DgroupId=com.firewall \
            -DartifactId=firewall-jdbc \
            -Dversion=1.0.2 \
            -Dpackaging=jar

      - name: Maven Build (dev profile, skip tests)
        run: |
          mvn -B clean package \
            -DskipTests \
            --file pom.xml

      - name: Verify artifact (JAR contains BOOT-INF/classes/static/index.html → frontend integrated)
        run: |
          JAR="sa-admin/target/sa-admin-dev-3.0.4.jar"
          if [ ! -f "$JAR" ]; then
            echo "❌ Expected JAR not found: $JAR"
            ls -la sa-admin/target/ || true
            exit 1
          fi
          echo "✅ JAR found: $JAR ($(du -h $JAR | cut -f1))"
          echo ""
          echo "=== JAR 内前端资源 (BOOT-INF/classes/static) ==="
          unzip -l "$JAR" | grep -E "BOOT-INF/classes/static/(index\.html|js/|css/|assets/|favicon)" | head -30 || true
          echo ""
          if unzip -p "$JAR" BOOT-INF/classes/static/index.html | head -3 | grep -q "SmartAdmin\|Vite\|html"; then
            echo "✅ index.html 内嵌于 JAR 的 static/ 中 —— 前端已成功集成"
          else
            echo "❌ 未找到 BOOT-INF/classes/static/index.html，前端未集成"
            exit 1
          fi

  build-java8:
    name: Build Backend (Java 8 + Spring Boot 2 + Frontend)
    needs: build-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-admin-api-java8-springboot2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: smart-admin-web-dist
          path: smart-admin-web-typescript/dist

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install firewall-jdbc JAR from GitHub Release (com.firewall:firewall-jdbc:1.0.2)
        run: |
          set -euo pipefail
          JAR_URL="https://github.com/toneliu/firewall-jdbc/releases/download/v1.0.2/firewall-jdbc-1.0.2.jar"
          TMP="/tmp/firewall-jdbc-1.0.2.jar"
          curl -sSL --fail-with-body -o "$TMP" "$JAR_URL"
          ls -lh "$TMP"
          mvn -B install:install-file \
            -Dfile="$TMP" \
            -DgroupId=com.firewall \
            -DartifactId=firewall-jdbc \
            -Dversion=1.0.2 \
            -Dpackaging=jar

      - name: Maven Build (dev profile, skip tests)
        run: |
          mvn -B clean package \
            -DskipTests \
            --file pom.xml

      - name: Verify artifact (JAR contains BOOT-INF/classes/static/index.html)
        run: |
          JAR="sa-admin/target/sa-admin-dev-3.0.4.jar"
          if [ ! -f "$JAR" ]; then
            echo "❌ Expected JAR not found: $JAR"
            ls -la sa-admin/target/ || true
            exit 1
          fi
          echo "✅ JAR found: $JAR ($(du -h $JAR | cut -f1))"
          if unzip -l "$JAR" | grep -q "BOOT-INF/classes/static/index.html"; then
            echo "✅ index.html 内嵌于 JAR 的 static/ 中 —— 前端已成功集成"
          else
            echo "❌ 未找到 BOOT-INF/classes/static/index.html，前端未集成"
            exit 1
          fi
