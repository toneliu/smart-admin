  1→name: Backend Release (Tag Build & Publish)
  2→
  3→on:
  4→  push:
  5→    tags:
  6→      - 'sa-v[0-9]+.[0-9]+.[0-9]+**'
  7→  workflow_dispatch:
  8→
  9→permissions:
 10→  contents: write
 11→
 12→jobs:
 13→  build-backend:
 14→    name: Build Backend ${{ matrix.label }}
 15→    runs-on: ubuntu-latest
 16→    strategy:
 17→      fail-fast: false
 18→      matrix:
 19→        include:
 20→          - label: Java17+SpringBoot3
 21→            dir: smart-admin-api-java17-springboot3
 22→            jdk: '17'
 23→            output_name: smart-admin-backend-java17-springboot3.jar
 24→          - label: Java8+SpringBoot2
 25→            dir: smart-admin-api-java8-springboot2
 26→            jdk: '8'
 27→            output_name: smart-admin-backend-java8-springboot2.jar
 28→
 29→    steps:
 30→      - name: Checkout
 31→        uses: actions/checkout@v4
 32→
 33→      - name: Extract version info
 34→        id: info
 35→        run: |
 36→          set -euo pipefail
 37→          TAG_NAME="${GITHUB_REF_NAME}"
 38→          # tag 形如 sa-v1.0.0，提取语义版本号
 39→          SEM_VER="${TAG_NAME#sa-v}"
 40→          echo "tag=$TAG_NAME"
 41→          echo "semver=$SEM_VER"
 42→          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
 43→          echo "semver=$SEM_VER" >> $GITHUB_OUTPUT
 44→
 45→      - name: Setup JDK ${{ matrix.jdk }}
 46→        uses: actions/setup-java@v4
 47→        with:
 48→          java-version: ${{ matrix.jdk }}
 49→          distribution: 'temurin'
 50→          cache: 'maven'
 51→
 52→      - name: Maven Package (prod profile, skip tests)
 53→        working-directory: ${{ matrix.dir }}
 54→        run: |
 55→          set -euo pipefail
 56→          mvn -B clean package \
 57→            -Pprod \
 58→            -DskipTests \
 59→            --file pom.xml
 60→
 61→      - name: Verify and rename artifact
 62→        id: artifact
 63→        run: |
 64→          set -euo pipefail
 65→          SRC="${{ matrix.dir }}/sa-admin/target/sa-admin-prod-3.0.1.jar"
 66→          if [ ! -f "$SRC" ]; then
 67→            echo "❌ Build output not found: $SRC"
 68→            echo "--- Listing ${{ matrix.dir }}/sa-admin/target/ ---"
 69→            ls -la "${{ matrix.dir }}/sa-admin/target/" || true
 70→            exit 1
 71→          fi
 72→          # 用输出名 + 语义版本号重命名，便于辨识
 73→          DIR="release-artifacts"
 74→          mkdir -p "$DIR"
 75→          OUTPUT="${DIR}/${{ matrix.output_name }}"
 76→          # 不带版本号的通用名
 77→          cp "$SRC" "$OUTPUT"
 78→          # 带版本号的命名
 79→          VERSIONED="${DIR}/$(basename $OUTPUT .jar)-${{ steps.info.outputs.semver }}.jar"
 80→          cp "$SRC" "$VERSIONED"
 81→          echo "✅ Produced:"
 82→          ls -lah "$OUTPUT" "$VERSIONED"
 83→          SHA256=$(sha256sum "$OUTPUT" | awk '{print $1}')
 84→          echo "sha256=$SHA256"
 85→          echo "output=$OUTPUT" >> $GITHUB_OUTPUT
 86→          echo "versioned=$VERSIONED" >> $GITHUB_OUTPUT
 87→          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
 88→
 89→      - name: Upload build artifacts (for release job aggregation)
 90→        uses: actions/upload-artifact@v4
 91→        with:
 92→          name: backend-build-${{ matrix.label }}
 93→          path: release-artifacts/*
 94→          retention-days: 7
 95→
 96→  release:
 97→    name: Publish GitHub Release
 98→    needs: build-backend
 99→    runs-on: ubuntu-latest
100→    steps:
101→      - name: Checkout
102→        uses: actions/checkout@v4
103→        with:
104→          fetch-depth: 0
105→
106→      - name: Download all build artifacts
107→        uses: actions/download-artifact@v4
108→        with:
109→          path: release-staging
110→          pattern: backend-build-*
111→          merge-multiple: true
112→
113→      - name: Inspect release staging
114→        run: |
115→          echo "=== Release staging contents ==="
116→          ls -lah release-staging/
117→          echo ""
118→          echo "=== SHA256 Checksums ==="
119→          (cd release-staging && sha256sum *.jar) | tee release-staging/SHA256SUMS.txt
120→
121→      - name: Copy SQL scripts
122→        run: |
123→          set -euo pipefail
124→          SQL_SRC="数据库SQL脚本"
125→          if [ -d "$SQL_SRC" ]; then
126→            SQL_ZIP="release-staging/smart-admin-sql-scripts.zip"
127→            zip -r "$SQL_ZIP" "$SQL_SRC"
128→            echo "✅ SQL scripts packaged: $SQL_ZIP"
129→          else
130→            echo "⚠️ SQL scripts directory not found, skipping."
131→          fi
132→
133→      - name: Generate release notes
134→        id: notes
135→        run: |
136→          cat > RELEASE_BODY.md << 'NOTES_EOF'
137→          ## SmartAdmin 后端发布包
138→          
139→          本 Release 由 GitHub Actions 自动构建，包含两个后端版本的 Spring Boot 可执行 JAR（prod profile）。
140→          
141→          ### 产物清单
142→          NOTES_EOF
143→          
144→          for jar in release-staging/*.jar; do
145→            NAME=$(basename "$jar")
146→            SIZE=$(du -h "$jar" | cut -f1)
147→            SHA=$(sha256sum "$jar" | awk '{print $1}')
148→            echo "- **$NAME** ($SIZE) — \`sha256:$SHA\`" >> RELEASE_BODY.md
149→          done
150→          
151→          if [ -f release-staging/smart-admin-sql-scripts.zip ]; then
152→            echo "" >> RELEASE_BODY.md
153→            echo "### 数据库脚本" >> RELEASE_BODY.md
154→            echo "- smart-admin-sql-scripts.zip：初始化 SQL 脚本（来源于仓库「数据库SQL脚本」目录）" >> RELEASE_BODY.md
155→          fi
156→          
157→          cat >> RELEASE_BODY.md << 'NOTES_EOF'
158→          
159→          ### 启动方式
160→          ```bash
161→          # Java 17 + Spring Boot 3 版本（推荐新环境）
162→          java -jar smart-admin-backend-java17-springboot3.jar \
163→            --spring.profiles.active=prod \
164→            --spring.datasource.druid.url=jdbc:mysql://localhost:3306/smart_admin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai \
165→            --spring.datasource.druid.username=root \
166→            --spring.datasource.druid.password=your_password
167→          
168→          # Java 8 + Spring Boot 2 版本（兼容旧环境）
169→          java -jar smart-admin-backend-java8-springboot2.jar \
170→            --spring.profiles.active=prod
171→          ```
172→          
173→          ### 使用的版本
174→          - SmartAdmin 源码版本：pom.xml 中 3.0.0
175→          - Java 17 版本：Spring Boot 3.5.4
176→          - Java 8 版本：Spring Boot 2.7.18
177→          NOTES_EOF
178→          
179→          cat RELEASE_BODY.md
180→
181→      - name: Create GitHub Release & Upload Assets
182→        uses: softprops/action-gh-release@v2
183→        with:
184→          name: SmartAdmin Backend ${{ github.ref_name }}
185→          body_path: RELEASE_BODY.md
186→          files: |
187→            release-staging/*.jar
188→            release-staging/*.zip
189→            release-staging/SHA256SUMS.txt
190→          fail_on_unmatched_files: true
191→          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}