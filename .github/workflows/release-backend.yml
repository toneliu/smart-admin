name: Backend Release (Tag Build & Publish - includes Frontend)

on:
  push:
    tags:
      - 'sa-v[0-9]+.[0-9]+.[0-9]+**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-frontend:
    name: Build Frontend (smart-admin-web-typescript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 (Vite 5 requires Node >= 18)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smart-admin-web-typescript/package.json

      - name: npm install + build:prod (dist/)
        working-directory: smart-admin-web-typescript
        run: |
          set -euo pipefail
          node -v ; npm -v
          npm install --no-audit --no-fund 2>&1 | tail -20
          npm run build:prod 2>&1 | tail -30
          echo ""
          echo "=== dist/ 产物 ==="
          ls -lah dist/
          du -sh dist/

      - name: Upload dist artifact (shared to backend jobs)
        uses: actions/upload-artifact@v4
        with:
          name: smart-admin-web-dist
          path: smart-admin-web-typescript/dist/**
          retention-days: 7

  build-backend:
    name: Build Backend ${{ matrix.label }} + Frontend
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Java17+SpringBoot3
            dir: smart-admin-api-java17-springboot3
            jdk: '17'
            output_name: smart-admin-backend-java17-springboot3.jar
          - label: Java8+SpringBoot2
            dir: smart-admin-api-java8-springboot2
            jdk: '8'
            output_name: smart-admin-backend-java8-springboot2.jar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version info
        id: info
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          SEM_VER="${TAG_NAME#sa-v}"
          echo "tag=$TAG_NAME"
          echo "semver=$SEM_VER"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "semver=$SEM_VER" >> $GITHUB_OUTPUT

      - name: Download frontend dist artifact into smart-admin-web-typescript/dist/
        uses: actions/download-artifact@v4
        with:
          name: smart-admin-web-dist
          path: smart-admin-web-typescript/dist

      - name: Setup JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Install firewall-jdbc JAR from GitHub Release (com.firewall:firewall-jdbc:1.0.2)
        run: |
          set -euo pipefail
          JAR_URL="https://github.com/toneliu/firewall-jdbc/releases/download/v1.0.2/firewall-jdbc-1.0.2.jar"
          TMP="/tmp/firewall-jdbc-1.0.2.jar"
          echo "下载 firewall-jdbc 1.0.2 Release JAR: $JAR_URL"
          curl -sSL --fail-with-body -o "$TMP" "$JAR_URL"
          ls -lh "$TMP"
          mvn -B install:install-file \
            -Dfile="$TMP" \
            -DgroupId=com.firewall \
            -DartifactId=firewall-jdbc \
            -Dversion=1.0.2 \
            -Dpackaging=jar

      - name: Maven Package (prod profile, skip tests — frontend dist auto copied via maven-resources-plugin prepare-package phase)
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          mvn -B clean package \
            -Pprod \
            -DskipTests \
            --file pom.xml

      - name: Verify frontend is embedded + rename artifact
        id: artifact
        run: |
          set -euo pipefail
          SRC="${{ matrix.dir }}/sa-admin/target/sa-admin-prod-3.0.5.jar"
          if [ ! -f "$SRC" ]; then
            echo "❌ Build output not found: $SRC"
            echo "--- Listing ${{ matrix.dir }}/sa-admin/target/ ---"
            ls -la "${{ matrix.dir }}/sa-admin/target/" || true
            exit 1
          fi
          echo "✅ JAR: $SRC ($(du -h $SRC | cut -f1))"
          echo "=== 前端资源（BOOT-INF/classes/static 条目样例） ==="
          unzip -l "$SRC" 2>/dev/null | grep -E "BOOT-INF/classes/static/(index\.html|js/|css/|assets/|favicon|vue)" | head -20 || true
          if ! unzip -l "$SRC" | grep -q "BOOT-INF/classes/static/index.html"; then
            echo "❌ 致命：后端 JAR 中未发现前端 index.html（static/ 未集成）"
            exit 1
          fi
          echo "✅ 前端已嵌入：BOOT-INF/classes/static/index.html 存在"

          DIR="release-artifacts"
          mkdir -p "$DIR"
          OUTPUT="${DIR}/${{ matrix.output_name }}"
          cp "$SRC" "$OUTPUT"
          VERSIONED="${DIR}/$(basename $OUTPUT .jar)-${{ steps.info.outputs.semver }}.jar"
          cp "$SRC" "$VERSIONED"
          echo "✅ Produced release artifacts:"
          ls -lah "$OUTPUT" "$VERSIONED"
          SHA256=$(sha256sum "$OUTPUT" | awk '{print $1}')
          echo "sha256=$SHA256"
          echo "output=$OUTPUT" >> $GITHUB_OUTPUT
          echo "versioned=$VERSIONED" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload build artifacts (for release job aggregation)
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-${{ matrix.label }}
          path: release-artifacts/*
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-staging
          pattern: backend-build-*
          merge-multiple: true

      - name: Inspect release staging
        run: |
          echo "=== Release staging contents ==="
          ls -lah release-staging/
          echo ""
          echo "=== SHA256 Checksums ==="
          (cd release-staging && sha256sum *.jar) | tee release-staging/SHA256SUMS.txt

      - name: Copy SQL scripts
        run: |
          set -euo pipefail
          SQL_SRC="数据库SQL脚本"
          if [ -d "$SQL_SRC" ]; then
            SQL_ZIP="release-staging/smart-admin-sql-scripts.zip"
            zip -r "$SQL_ZIP" "$SQL_SRC"
            echo "✅ SQL scripts packaged: $SQL_ZIP"
          else
            echo "⚠️ SQL scripts directory not found, skipping."
          fi

      - name: Generate release notes
        id: notes
        run: |
          cat > RELEASE_BODY.md << 'NOTES_EOF'
          ## SmartAdmin 前后端一体化发布包
          
          🎉 **新特性：前端（Vue 3 + Vite + TypeScript 版）已集成到后端可执行 JAR 内！**
          现在 `java -jar xxx.jar` 之后，直接在浏览器访问同一端口即可打开前端页面，
          不需要再单独用 nginx 部署前端静态资源，也不需要配置跨域。
          
          ### 集成方式
          | 组件 | 来源 |
          |---|---|
          | 前端 | smart-admin-web-typescript（Vite build:prod → dist/） |
          | 后端 JAR 内嵌 | maven-resources-plugin prepare-package 阶段自动 copy 到 BOOT-INF/classes/static/ |
          | 静态资源访问 | Spring Boot 默认 `classpath:static/**` 自动暴露 |
          | 前端路由 | `createWebHashHistory()`（Hash 模式），不需要后端 forward index.html |
          | 后端 context-path | `/`（默认根路径） |
          | 端口 | 1024（可通过 `--server.port=xxxx` 覆盖） |
          | 前端 API 请求 | `VITE_APP_API_URL=''`（同源相对路径，**零跨域**），axios 自动打同端口 API |
          | firewall-jdbc 驱动 | 直接从 GitHub Release `v1.0.2/firewall-jdbc-1.0.2.jar` 下载 → `mvn install:install-file` 引入 |
          
          ### 启动方式（前后端一站式）
          ```bash
          # Java 17 + Spring Boot 3 版本（推荐新环境）
          java -jar smart-admin-backend-java17-springboot3.jar \
            --spring.profiles.active=prod \
            --spring.datasource.druid.url=jdbc:mysql://localhost:3306/smart_admin_v3?autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai \
            --spring.datasource.druid.username=root \
            --spring.datasource.druid.password=your_password \
            --server.port=1024
          # 启动后浏览器直接打开: http://服务器IP:1024/   （就是前端页面！）
          # 后端 API 同端口同域名自动服务，不需要额外代理
          
          # Java 8 + Spring Boot 2 版本（兼容旧环境）
          java -jar smart-admin-backend-java8-springboot2.jar \
            --spring.profiles.active=prod
          ```
          
          ### 产物清单
          NOTES_EOF
          
          for jar in release-staging/*.jar; do
            NAME=$(basename "$jar")
            SIZE=$(du -h "$jar" | cut -f1)
            SHA=$(sha256sum "$jar" | awk '{print $1}')
            echo "- **$NAME** ($SIZE) — \`sha256:$SHA\`" >> RELEASE_BODY.md
          done
          
          if [ -f release-staging/smart-admin-sql-scripts.zip ]; then
            echo "" >> RELEASE_BODY.md
            echo "### 数据库脚本" >> RELEASE_BODY.md
            echo "- smart-admin-sql-scripts.zip：初始化 SQL 脚本（来源于仓库「数据库SQL脚本」目录）" >> RELEASE_BODY.md
          fi
          
          cat >> RELEASE_BODY.md << 'NOTES_EOF'
          
          ### sa-v1.0.5 变更摘要（对比 sa-v1.0.4）
          - 🐛 **修复 sa-v1.0.4 CI 构建失败**：Java 17+SpringBoot3 / Java 8+SpringBoot2 两个 sa-admin 模块的 `pom.xml` 存在 `<plugins>` 标签双重嵌套，导致 Maven 无法解析 POM 直接抛 `ModelParseException`（错误信息：`Non-parseable POM: Unrecognised tag: 'plugins' @ line 62`）。本次修复已将 spring-boot-maven-plugin 移至第一层 `<plugins>` 下与 maven-resources-plugin 并列。
          - 🎉 **前后端一体化打包**（继承 sa-v1.0.4 特性）：前端 TypeScript 版（Vue 3 + Vite + Ant Design Vue 4）编译后嵌入 Spring Boot fat JAR 的 `BOOT-INF/classes/static/`，启动后 `http://host:1024/` 直接访问
          - 🔌 **API 同源**（继承 sa-v1.0.4 特性）：`.env.production` 将 `VITE_APP_API_URL` 改为空字符串，前端 axios 请求走相对路径，与后端共享同端口+域名，**零跨域零配置**
          - 🔧 **GitHub Actions 去 deprecated 警告**：`actions/setup-java` 从 v4 升级到 v5
          - 🔐 **防火墙身份透传保持不变**：FirewallDriver + FirewallIdentityFilter 仍按 Sa-Token 登录态 → FirewallContextHolder ThreadLocal → JDBC FirewallIdentityComment 注入路径
          - 📦 **依赖**：firewall-jdbc 仍按 `com.firewall:firewall-jdbc:1.0.2` 从 GitHub Release JAR 下载 → `mvn install:install-file` 引入
          - 📌 SmartAdmin 源码版本统一：3.0.5
          - ✅ 旧 Release：sa-v1.0.0 / sa-v1.0.1 / sa-v1.0.2 / sa-v1.0.3 / sa-v1.0.4 全部完整保留，不删除
          NOTES_EOF
          
          cat RELEASE_BODY.md

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: SmartAdmin (前后端一体化) ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          files: |
            release-staging/*.jar
            release-staging/*.zip
            release-staging/SHA256SUMS.txt
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
